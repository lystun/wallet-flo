networks:
  default:
    driver: bridge

services:
  postgres:
    image: postgres:latest
    container_name: postgresql
    restart: unless-stopped
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

  service:
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    build: .
    image: wallet-flo:latest
    env_file:
      - .env
volumes:
    postgres-data: