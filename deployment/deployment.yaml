apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-flo-deployment
  namespace: wallet-flo
  labels:
    app: wallet-flo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-flo
  template:
    metadata:
      labels:
        app: wallet-flo
    spec:
      containers:
        - name: wallet-flo
          image: europe-west1-docker.pkg.dev/borderless-money-455715/project-repo/wallet-flo:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # Database credentials
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: wallet-flo-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallet-flo-secret
                  key: DB_PASSWORD

            - name: FOREX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wallet-flo-secret
                  key: FOREX_API_KEY

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: wallet-flo-conf
                  key: DB_NAME

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: wallet-flo-conf
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: wallet-flo-conf
                  key: DB_PORT

            - name: FOREX_API_URL
              valueFrom:
                configMapKeyRef:
                  name: wallet-flo-conf
                  key: FOREX_API_URL

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
